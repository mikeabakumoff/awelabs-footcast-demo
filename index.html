    return'<button data-l="'+k+'" class="'+(k===lgSel?'on':'')+'"><span>'+(k==='all'?t.all:LG[k][L==='ru'?0:1])+'</span><i>'+n+'</i></button>'}).join('');
  document.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){lgSel=b.dataset.l;apply()}});
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab);b.onclick=function(){tab=b.dataset.t;apply()}});
  tab==='up'?renderUp():renderDone();
}
function renderUp(){var t=T[L];
  var ms=M.map(function(m,i){return[m,i]}).filter(function(x){return lgSel==='all'||x[0][0]===lgSel});
  if(!ms.some(function(x){return x[1]===sel}))sel=ms.length?ms[0][1]:0;
  $('list').innerHTML='<div class="hint">'+t.hint+'</div>'+ms.map(function(x){var m=x[0],i=x[1],p=isPub(m);
    return'<button class="mt'+(p?'':' skip')+(i===sel?' sel':'')+'" data-m="'+i+'"><div class="lgn"><span>'+LG[m[0]][L==='ru'?0:1]+'</span><span>'+tm(m)+'</span></div>'+
    '<div class="tm">'+esc(nm(m,1))+'<span>-</span>'+esc(nm(m,0))+'</div><span class="badge '+(p?'pub':'skp')+'">'+(p?'● '+t.pub:t.skp)+'</span>'+
    '<div class="probs"><div class="p1" style="width:'+m[6]+'%">'+m[6]+'%</div><div class="px" style="width:'+m[7]+'%">'+m[7]+'%</div><div class="p2" style="width:'+m[8]+'%">'+m[8]+'%</div></div></button>'}).join('');
  document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){sel=+b.dataset.m;renderUp()}});
  renderDet();
}
function renderDet(){var t=T[L],m=M[sel],b=best(m),p=isPub(m),th=thr(m);
  var pickTxt=b[0]==='h'?t.win+' '+nm(m,1):b[0]==='a'?t.win+' '+nm(m,0):t.draw;
  if(L==='ru')pickTxt=b[0]==='h'?'П1, '+nm(m,1):b[0]==='a'?'П2, '+nm(m,0):'ничья';else pickTxt=b[0]==='d'?'draw':(b[0]==='h'?nm(m,1):nm(m,0))+' win';
  var ens=m[10].map(function(v,i){return'<div><span>N'+(i+1)+'</span><span><i style="width:'+v+'%"></i></span><b>'+v+'%</b></div>'}).join('')+
    '<div class="agg"><span>'+t.agg+'</span><span><i style="width:'+b[1]+'%"></i></span><b>'+b[1]+'%</b></div>';
  var fac=F[L][m[11]].map(function(f){return'<li><i>'+esc(f[0])+'</i><span>'+esc(f[1])+'</span></li>'}).join('');
  var why=F[L][m[11]].filter(function(f){return f[0]!=='rule'&&f[0]!=='правило'}).slice(0,2).map(function(f){return f[1]}).join('; ');
  var post=p?'<div class="box" style="padding:0;border:0;background:none"><h5 style="padding:0 2px">'+t.post+'</h5><div class="post"><div class="ch"><i>FC</i>'+t.chN+'</div>'+
    '⚽ '+LG[m[0]][L==='ru'?0:1]+' · '+esc(nm(m,1))+' - '+esc(nm(m,0))+' · '+tm(m)+'\n'+
    (L==='ru'?'Прогноз: ':'Pick: ')+esc(pickTxt)+' ('+b[1]+'%)\n'+t.score+': '+m[9]+'\n'+t.why+': '+esc(why)+'<small>'+tm(m).split(' ')[1]+' · ✓✓</small></div></div>':'';
  $('det').innerHTML='<div class="box"><div class="sub">'+LG[m[0]][L==='ru'?0:1]+' · '+tm(m)+'</div><div class="hd">'+esc(nm(m,1))+' - '+esc(nm(m,0))+'</div>'+
    '<div class="probs" style="margin-top:10px"><div class="p1" style="width:'+m[6]+'%">'+t.cw+' '+m[6]+'%</div><div class="px" style="width:'+m[7]+'%">'+t.cx+'</div><div class="p2" style="width:'+m[8]+'%">'+t.ca+' '+m[8]+'%</div></div></div>'+
    '<div class="box"><h5>'+t.ens+'</h5><div class="ens">'+ens+'</div></div>'+
    '<div class="box"><h5><span>'+t.fac+'</span></h5><ul class="fac">'+fac+'</ul><div class="sub" style="margin-top:10px">'+t.facN+'</div></div>'+
    '<div class="dec '+(p?'pub':'skp')+'">'+(p?t.dPub:t.dSkp).replace('{c}',b[1]).replace('{t}',th)+'</div>'+post;
}
function renderDone(){var t=T[L];
  var rs=R.filter(function(r){return lgSel==='all'||r[4]===lgSel});
  var hit=R.filter(function(r){return r[10]}).length,ex=R.filter(function(r){return r[8]===r[9]}).length;
  $('list').innerHTML='<div class="sum"><div><b>'+R.length+'</b><span>'+t.s1+'</span></div><div class="g"><b>'+hit+'/'+R.length+'</b><span>'+t.s2+'</span></div><div><b>'+ex+'</b><span>'+t.s3+'</span></div></div>'+
   rs.map(function(r){return'<div class="res"><div>'+esc(L==='ru'?r[0]:r[1])+' - '+esc(L==='ru'?r[2]:r[3])+'<small>'+LG[r[4]][L==='ru'?0:1]+' · '+t.pick+' '+(L==='ru'?r[5]:r[6])+' ('+r[7]+'%) · '+r[8]+'</small></div><div class="sc">'+r[9]+'</div><span class="badge '+(r[10]?'hit':'mis')+'">'+(r[10]?'✓':'✕')+'</span></div>'}).join('');
  $('det').innerHTML='<div class="box"><h5>'+t.hd2+'</h5><p style="font-size:14px;color:var(--muted)">'+t.hd2t+'</p></div>'+
   '<div class="box"><h5>'+t.hAcc+'</h5><div class="bars" style="display:flex;flex-direction:column;gap:10px"><div class="bar g"><span>'+t.aModel+'</span> <b class="mono" style="color:var(--g)">52.8%</b><div><i style="width:52.8%"></i></div></div><div class="bar"><span>'+t.aBase+'</span> <b class="mono">44.0%</b><div><i style="width:44%"></i></div></div></div></div>';
}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){L=b.dataset.set;try{localStorage.setItem('fc_lang',L)}catch(e){}apply()}});
apply();
</script>

<script>
(function(){
  var note=document.querySelector('.note');if(!note)return;
  var CFG={pick:'#list .mt:not(.skip)',target:'#det',label:{ru:'Разобрать прогноз',en:'See the forecast breakdown'},wait:{ru:'Загружаю...',en:'Loading...'}};
  var b=document.createElement('button');b.className='mrun';b.type='button';b.innerHTML='<i>&#9654;</i><span></span>';
  note.parentNode.insertBefore(b,note.nextSibling);
  function lang(){return (document.documentElement.lang||'ru').slice(0,2)==='en'?'en':'ru'}
  function label(t){b.querySelector('span').textContent=t||CFG.label[lang()]}
  label();new MutationObserver(function(){label()}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  function go(){var el=document.querySelector(CFG.pick);if(!el)return false;el.click();
    setTimeout(function(){var t=document.querySelector(CFG.target);t=t?(t.closest('.panel')||t):null;if(t){window.scrollTo({top:t.getBoundingClientRect().top+window.pageYOffset-8,behavior:'smooth'})}},150);return true}
  b.onclick=function(){if(go())return;b.disabled=true;label(CFG.wait[lang()]);var n=0,iv=setInterval(function(){n++;if(CFG.force){try{window[CFG.force]()}catch(e){}}if(go()||n>40){clearInterval(iv);b.disabled=false;label()}},400)};
})();
</script>

<script>
(function(){
  var YM_ID=114360768, GA_ID='G-7B459D4QSM';           // <- set real IDs
  window.aweBeacon=function(name,d){
    try{var q='e='+encodeURIComponent(name)+'&p='+encodeURIComponent(location.pathname)+'&d='+encodeURIComponent(d||'');
      if(navigator.sendBeacon)navigator.sendBeacon('https://awelabs.io/t?'+q);else new Image().src='https://awelabs.io/t?'+q}catch(e){}
  };
  window.aweGoal=function(name,params){
    aweBeacon(name,params&&(params.demo||params.repo||params.lang));
    try{if(YM_ID&&window.ym)ym(YM_ID,'reachGoal',name,params||{})}catch(e){}
    try{if(GA_ID&&window.gtag)gtag('event',name,params||{})}catch(e){}
  };
  if(YM_ID){
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();
    for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r)return}
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window,document,'script','https://mc.yandex.ru/metrika/tag.js','ym');
    ym(YM_ID,'init',{clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:false});
  }
  if(GA_ID){
    var s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};
    gtag('js',new Date());gtag('config',GA_ID,{anonymize_ip:true});
  }
  aweBeacon('pv',document.referrer?document.referrer.split('/')[2]:'');

    else if(h.indexOf('github.com')>-1)aweGoal('open_github',{repo:h.split('/').pop()});
    else if(a.dataset&&a.dataset.set)aweGoal('lang_switch',{lang:a.dataset.set});
    else if(a.tagName==='BUTTON')aweBeacon('button',a.id||a.getAttribute('data-i')||(a.textContent||'').trim().slice(0,30));
